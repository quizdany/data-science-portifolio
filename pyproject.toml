[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-science-portfolio"
version = "0.1.0"
description = "Reproducible data science projects: credit default risk model and penguin species classifier."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[project.scripts]
penguin-classifier = "penguin_classifier.cli:app"
credit-risk = "credit_risk.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

